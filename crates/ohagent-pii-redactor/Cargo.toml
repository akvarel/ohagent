[package]
name = "ohagent-pii-redactor"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "PII/Secret Redaction Plugin for ohAgent — detects and redacts sensitive data before LLM transmission"

[lib]
crate-type = ["cdylib"]

[dependencies]
ohagent-plugins = { path = "../ohagent-plugins" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
