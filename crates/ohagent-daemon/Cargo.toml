[package]
name = "ohagent-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "24/7 daemon process for ohAgent"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
chrono = { workspace = true }
toml = "0.8"
shellexpand = { workspace = true }
uuid = { workspace = true }
ohagent-core = { path = "../ohagent-core" }
ohagent-plugins = { path = "../ohagent-plugins" }
ohagent-gateway = { path = "../ohagent-gateway" }
ohagent-memory = { path = "../ohagent-memory" }
ohagent-skills = { path = "../ohagent-skills" }
jcode-base = { path = "../../jcode/crates/jcode-base" }
jcode-provider-core = { path = "../../jcode/crates/jcode-provider-core" }
jcode-message-types = { path = "../../jcode/crates/jcode-message-types" }
jcode-provider-openrouter-runtime = { path = "../../jcode/crates/jcode-provider-openrouter-runtime" }
futures = { workspace = true }
tokio-stream = "0.1"
async-stream = "0.3"
ohagent-reasoning = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
prometheus = "0.13"
dashmap = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
cucumber = "0.21"
tokio = { workspace = true, features = ["process"] }
assert-json-diff = "2"
