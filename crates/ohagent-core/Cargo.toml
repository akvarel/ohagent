[package]
name = "ohagent-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core agent loop, config, and provider bridge for ohAgent"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
ohagent-reasoning = { workspace = true }

# Jcode integration — public SDK plus provider access for existing direct OpenAI/ws paths
jcode-sdk = { path = "../../jcode/crates/jcode-sdk" }
jcode-base = { path = "../../jcode/crates/jcode-base", features = ["embeddings"] }
jcode-provider-core = { path = "../../jcode/crates/jcode-provider-core" }
jcode-message-types = { path = "../../jcode/crates/jcode-message-types" }
toml = "0.8"
rusqlite = { workspace = true }
shellexpand = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
reqwest = { workspace = true }
futures = { workspace = true }
tokio-stream = "0.1"
ohagent-swarm = { workspace = true }

[dev-dependencies]
jcode-provider-openrouter-runtime = { path = "../../jcode/crates/jcode-provider-openrouter-runtime" }
