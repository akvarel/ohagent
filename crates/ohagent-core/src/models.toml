# Model Catalog
#
# Each model entry defines capabilities, pricing, and provider.
# API keys come from environment (or Vault). Models are tried in order
# within the same capability tier — first available wins.

# ── Tier: budget (cheap, fast, for simple tasks) ──

[[models]]
id = "deepseek-v4-flash"
provider = "deepseek"
api_key_env = "DEEPSEEK_API_KEY"
display = "DeepSeek V4 Flash"
capabilities = ["coding", "general_chat", "analysis"]
cost_tier = "low"
context = 128_000

[[models]]
id = "openai-gpt-4o-mini"
provider = "openai"
api_key_env = "OPENAI_API_KEY"
display = "GPT-4o Mini"
capabilities = ["coding", "general_chat", "analysis", "creative_writing"]
cost_tier = "low"
context = 128_000

