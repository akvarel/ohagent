# ── Defaults ──

[defaults]
# Which capability to use when no task pattern is detected
fallback_capability = "general_chat"
# Default cost tier (budget unless task needs more)
default_tier = "low"
# Max tier to auto-select (never auto-select premium without user request)
max_auto_tier = "medium"
