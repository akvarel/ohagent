# Model Catalog
#
# Each model entry defines capabilities, pricing, and provider.
# API keys come from environment (or Vault). Models are tried in order
# within the same capability tier — first available wins.
#
# Models are also exposed via GET /v1/models for Open WebUI picker.
# Preferences can be set via GET/POST /v1/models/prefs (tenant-scoped).

# ── Tier: budget (cheap, fast, for simple tasks) ──

[[models]]
id = "deepseek-v4-flash"
provider = "deepseek"
api_key_env = "DEEPSEEK_API_KEY"
display = "DeepSeek V4 Flash"
capabilities = ["coding", "general_chat", "analysis", "translation"]
cost_tier = "low"
context = 1_000_000
# Pricing: USD per 1M tokens (input / output)
input_price = 0.14
output_price = 0.28
# Off-peak: 50% discount during UTC 16:30–00:30 (DeepSeek automatic)
off_peak_discount = 0.50
off_peak_start_utc = "16:30"
off_peak_end_utc = "00:30"
# Deprecated aliases: deepseek-chat (non-thinking), deepseek-reasoner (thinking mode)
# These will stop working 2026-07-24 — use deepseek-v4-flash directly.

