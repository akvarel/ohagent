[package]
name = "ohagent-eloop"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Engineering task compiler, verifier contracts, and campaign foundation for ohAgent"

[[bin]]
name = "eloop"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
