[package]
name = "ohagent-swarm"
version = "0.1.0"
edition = "2021"
description = "Swarm orchestration for ohAgent — DAG-based multi-agent task execution"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
