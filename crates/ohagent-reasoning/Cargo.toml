[package]
name = "ohagent-reasoning"
version = "0.1.0"
edition = "2021"
description = "CMC controller + replay-driven optimization for ohAgent test-time scaling"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
