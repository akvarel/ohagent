[package]
name = "ohagent-aggregator-plugin"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "ohAggregator Plugin — multi-provider API aggregation with billing (closed source)"

[lib]
crate-type = ["cdylib"]

[dependencies]
ohagent-plugins = { path = "../ohagent-plugins" }
ohagent-aggregator-core = { path = "../ohagent-aggregator-core" }
