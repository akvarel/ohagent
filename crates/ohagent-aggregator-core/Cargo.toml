[package]
name = "ohagent-aggregator-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "ohAggregator core — API key management + billing tracker (open source)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
