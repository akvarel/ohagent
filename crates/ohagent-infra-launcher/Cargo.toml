[package]
name = "ohagent-infra-launcher"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "Infrastructure Launcher Plugin for ohAgent — on-demand GPU instances for custom models & LoRA"

[lib]
crate-type = ["cdylib"]

[dependencies]
ohagent-plugins = { path = "../ohagent-plugins" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
