[workspace]
resolver = "2"
members = [
    "crates/ohagent-core",
    "crates/ohagent-daemon",
    "crates/ohagent-gateway",
    "crates/ohagent-memory",
    "crates/ohagent-skills",
    "crates/ohagent-cron",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/orangehat/ohAgent"
description = "OrangeHat AI Agent — 24/7 personal AI assistant built on Jcode"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite"] }
clap = { version = "4", features = ["derive"] }
tonic = "0.12"
prost = "0.13"
tower = "0.5"
