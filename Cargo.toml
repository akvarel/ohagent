[workspace]
resolver = "2"
members = [
    "crates/ohagent-core",
    "crates/ohagent-daemon",
    "crates/ohagent-gateway",
    "crates/ohagent-memory",
    "crates/ohagent-skills",
    "crates/ohagent-cron",
    "crates/ohagent-swarm",
    "crates/ohagent-reasoning",
    "crates/ohagent-desktop-mcp",
    "crates/ohagent-plugins",
    "crates/ohagent-pii-redactor",
    "crates/ohagent-infra-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/orangehat/ohAgent"
description = "OrangeHat AI Agent — 24/7 personal AI assistant built on Jcode"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "sqlite"] }
clap = { version = "4", features = ["derive"] }
tonic = "0.12"
prost = "0.13"
tower = "0.5"
teloxide = { version = "0.13", default-features = false, features = ["rustls", "ctrlc_handler", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
futures = "0.3"
once_cell = "1"
async-trait = "0.1"
dashmap = "6"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
shellexpand = "3"

# Helpers
ohagent-swarm = { path = "crates/ohagent-swarm" }
ohagent-reasoning = { path = "crates/ohagent-reasoning" }
