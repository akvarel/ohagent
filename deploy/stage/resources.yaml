apiVersion: v1
kind: Namespace
metadata:
  name: ohagent-stage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ohagent-site
  namespace: ohagent-stage
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ohagent-site
  template:
    metadata:
      labels:
        app: ohagent-site
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: site
          image: rg.pl-waw.scw.cloud/orangehat/ohagent@sha256:f0b274f726c1992eb277e1ec1dc2cb24821d93f4de5da053331828f9ec8029d5
          imagePullPolicy: Never
          command: [ohagent-daemon, --site-only, --health-port, "9090"]
          ports:
            - name: http
              containerPort: 9090
          env:
            - name: OHAGENT_AAAS_ENABLED
              value: "0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ohagent-site
  namespace: ohagent-stage
spec:
  selector:
    app: ohagent-site
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: noindex
  namespace: ohagent-stage
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: noindex, nofollow, noarchive
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ohagent-site
  namespace: ohagent-stage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: ohagent-stage-noindex@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts: [stage.orangehat.ai]
      secretName: ohagent-stage-tls
  rules:
    - host: stage.orangehat.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ohagent-site
                port:
                  name: http
