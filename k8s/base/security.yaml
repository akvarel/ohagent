# K8s Security — prevents agent from modifying cluster
#
# Multi-layer defense: NetworkPolicy + no SA token + zero caps + code guard
# Changes require kubectl from OUTSIDE the pod or external agent (CI/CD).

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ohagent-deny-api-server
  namespace: ohagent
spec:
  podSelector:
    matchLabels:
      app: ohagent
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: orangehat
          podSelector:
            matchLabels:
              app: vault
      ports:
        - port: 8200
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.43.0.0/16
      ports:
        - port: 443
        - port: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ohagent-sa
  namespace: ohagent
automountServiceAccountToken: false
